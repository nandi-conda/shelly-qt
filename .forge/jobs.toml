# fileapi forge CI: build the AppImages (x86_64 + aarch64) on Depot and publish them as a
# release of this repo: `continuous` for every push to main, <tag> for v* tags.
# See packaging/appimage/forge-build.sh. Needs DEPOT_TOKEN (a user secret works) and DEPOT_PROJECT_ID.
[[job]]
name = "appimage"
branches = ["main"]
tags = ["v*"]
timeout = 3600
# The forge puts the Depot CLI on PATH only for scripts that mention `depot`.
run = """
depot --version
bash packaging/appimage/forge-build.sh
"""
