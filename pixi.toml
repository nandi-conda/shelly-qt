[workspace]
name = "shelly-qt"
version = "0.1.0"
description = "PySide6 front end for the Shelly (Shelly-ALPM) Arch Linux package manager"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = ">=3.11,<3.14"
pyside6 = ">=6.5"

[pypi-dependencies]
shelly-qt = { path = ".", editable = true }

[tasks]
start = "python -m shelly_qt"
demo = { cmd = "python -m shelly_qt", env = { SHELLY_BIN = "python tests/fake_shelly.py", SHELLY_ELEVATE = "" } }

[feature.test.dependencies]
pytest = "*"

[feature.test.tasks]
test = { cmd = "pytest -q", env = { QT_QPA_PLATFORM = "offscreen" } }

[environments]
default = { features = ["test"], solve-group = "default" }
